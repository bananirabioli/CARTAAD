name: cartaad

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: cartaad-backend:local
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://cartaad:cartaad@db:5432/cartaad
    REDIS_URL: redis://redis:6379/0
    CELERY_EAGER: "false"
    STORAGE_DIR: /data/files
    RENDERER: playwright
    AUTO_SEED: "false"
    # MVP defaults; .env can switch back to the offline demo (DEMO_MODE=true, LLM_PROVIDER=mock, IMAGE_PROVIDER=placeholder).
    DEMO_MODE: ${DEMO_MODE:-false}
    LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
    IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openrouter}
    VIDEO_PROVIDER: ${VIDEO_PROVIDER:-openrouter}
  volumes:
    - files:/data/files
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cartaad
      POSTGRES_PASSWORD: cartaad
      POSTGRES_DB: cartaad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartaad -d cartaad"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    image: cartaad-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional S3-compatible storage: `docker compose --profile s3 up` and set STORAGE_BACKEND=s3 in .env
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cartaad
      MINIO_ROOT_PASSWORD: cartaad-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  files:
  minio:
